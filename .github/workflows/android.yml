name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Test and build release-like variants
        run: |
          chmod +x gradlew
          ./gradlew --no-problems-report --dependency-verification=strict test lintRelease assembleRelease bundleRelease assembleBenchmark :app:verifyReleaseProfiles :macrobenchmark:assembleBenchmark :app:reproducibleSbom
      - name: Stage source-matched unsigned build evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p app/build/dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/dist/
          cp app/build/outputs/bundle/release/app-release.aab app/build/dist/
          cp app/build/reports/cyclonedx/nanokvm-mobile.cdx.json app/build/dist/
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md PRIVACY.md SECURITY.md app/build/dist/
          git archive --format=tar.gz --prefix=nanokvm-mobile-source/ -o app/build/dist/nanokvm-mobile-source.tar.gz HEAD
          cd app/build/dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload unsigned source-matched build evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NanoKVM-Mobile-${{ github.sha }}-unsigned-source-evidence
          if-no-files-found: error
          path: app/build/dist/
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NanoKVM-Mobile-sbom
          if-no-files-found: error
          path: app/build/reports/cyclonedx/nanokvm-mobile.cdx.json

  device-tests:
    name: Device tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api26-minimum
            api-level: 26
            arch: x86_64
          - name: api35-previous
            api-level: 35
            arch: x86_64
          - name: api36-previous
            api-level: 36
            arch: x86_64
          - name: api37-current
            api-level: 37
            arch: x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run functional instrumentation tests
        if: matrix.api-level != 37
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: ${{ matrix.arch }}
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-problems-report --dependency-verification=strict :app:connectedDebugAndroidTest
      - name: Run API 37 instrumentation, profile generation, and benchmarks
        if: matrix.api-level == 37
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: ${{ matrix.arch }}
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew --no-problems-report --dependency-verification=strict :app:connectedDebugAndroidTest
            ./gradlew --no-problems-report --dependency-verification=strict :video:connectedDebugAndroidTest
            ./gradlew --no-problems-report --dependency-verification=strict :app:generateBaselineProfile :app:verifyReleaseProfiles
            git diff --exit-code -- app/src/main/generated/baselineProfiles/
            ./gradlew --no-problems-report --dependency-verification=strict -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark :macrobenchmark:connectedBenchmarkAndroidTest
      - name: Upload device-test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NanoKVM-Mobile-${{ matrix.name }}-device-results
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            video/build/reports/androidTests/connected/
      - name: Upload API 37 profiles, benchmark metrics, and traces
        if: always() && matrix.api-level == 37
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NanoKVM-Mobile-api37-profiles-and-benchmarks
          if-no-files-found: warn
          path: |
            app/src/main/generated/baselineProfiles/
            macrobenchmark/build/reports/androidTests/connected/
            macrobenchmark/build/outputs/connected_android_test_additional_output/
