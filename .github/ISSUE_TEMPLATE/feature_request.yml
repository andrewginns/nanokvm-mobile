name: Feature request
description: Propose a capability or usability improvement with its safety and compatibility constraints.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/WEBUI_PARITY.md` first. A native presentation may replace a browser-specific WebUI feature when it preserves the useful outcome and safety boundary.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the task that is difficult today, not only the preferred control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: compatibility
    attributes:
      label: NanoKVM and Android scope
      description: Known NanoKVM application/hardware dependency and Android versions or device types.
  - type: dropdown
    id: risk
    attributes:
      label: Highest expected risk
      options:
        - Read-only or local presentation
        - Reversible session/input action
        - Persistent appliance configuration
        - Destructive, disruptive, root, network, or external write
        - Unsure
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, privacy, and failure behavior
      description: Cover confirmation, cancellation, reconnect/replay, credentials, network peers, and recovery where applicable.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I did not include a password, token, private address, certificate fingerprint, or remote-screen capture.
          required: true
